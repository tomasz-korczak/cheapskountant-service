openapi: 3.0.3
info:
  title: Cheapskountant receipt discounts
  version: 1.1.0
  description: |
    Extends the receipt body from specs/001-create-receipt/contracts/create-receipt.openapi.yaml.
    POST /api/transcription and POST /api/receipt are unchanged in path, method, and errors.
    The success body may include an item discount and a receipt discount summary.
paths:
  /api/transcription:
    post:
      summary: Transcribe one receipt, including discounts when printed
      description: |
        Same request as create-receipt. The success body is StoredReceipt without id.
        A discount printed under an item is items[].discount. OPUSTY ŁĄCZNIE is discountSummary.
      responses:
        '200':
          description: Transcribed receipt. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredReceipt'
        '422':
          description: incomplete when a present discount or discount summary is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptFailure'
  /api/receipt:
    post:
      summary: Store a structured receipt, including discounts when present
      description: |
        Accepts the transcription body. Returns it with an assigned id.
        A present discount or discount summary with a blank description or an amount
        that is not below zero is incomplete, and nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoredReceipt'
      responses:
        '201':
          description: Stored receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredReceipt'
        '422':
          description: incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptFailure'
components:
  schemas:
    ReceiptFailure:
      type: object
      required: [reason, explanation]
      properties:
        reason:
          type: string
          enum:
            - invalid submission
            - not authorized
            - unreadable
            - incomplete
            - transcription unavailable
            - storage failed
        explanation:
          type: string
          minLength: 1
    StoredReceipt:
      type: object
      description: |
        receipt-schema.json plus id. discountSummary is optional.
        Other required groups are unchanged from create-receipt.
      required: [documentType, seller, receipt, items, taxSummary, totals, payments]
      properties:
        id:
          type: integer
          format: int64
          description: Assigned by storage. Omitted by transcription. Ignored on input.
        documentType:
          type: string
          enum: [fiscal_receipt]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineItem'
        discountSummary:
          $ref: '#/components/schemas/Discount'
        taxSummary:
          type: array
          minItems: 1
          items:
            type: object
        totals:
          type: object
        payments:
          type: array
          minItems: 1
          items:
            type: object
    LineItem:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPrice, total, taxCategory]
      properties:
        description:
          type: string
        itemType:
          type: string
          enum: [product, service, packaging, other]
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
        unitPrice:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        taxCategory:
          type: string
        discount:
          $ref: '#/components/schemas/Discount'
    Discount:
      type: object
      additionalProperties: false
      required: [description, total]
      properties:
        description:
          type: string
          minLength: 1
        total:
          $ref: '#/components/schemas/NegativeMoney'
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
    NegativeMoney:
      type: string
      description: Currency amount strictly less than zero, with two fractional digits.
      pattern: '^-(?:0*[1-9][0-9]*\.[0-9]{2}|0\.[0-9][1-9]|0\.[1-9][0-9])$'
